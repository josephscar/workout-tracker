name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Pick an iPhone simulator
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in runtimes if ".iOS-" in r), key=lambda r: [int(p) for p in r.rsplit(".iOS-", 1)[1].split("-")])
          phones = [d for d in runtimes[ios[-1]] if d["name"].startswith("iPhone")]
          print(phones[-1]["udid"])
          ')
          echo "SIMULATOR_ID=$id" >> "$GITHUB_ENV"
      - name: Build and test
        run: >
          xcodebuild test -quiet
          -project WorkoutTracker.xcodeproj
          -scheme WorkoutTracker
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          CODE_SIGNING_ALLOWED=NO
      - name: Build Release
        run: >
          xcodebuild build -quiet
          -project WorkoutTracker.xcodeproj
          -scheme WorkoutTracker
          -configuration Release
          -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO
